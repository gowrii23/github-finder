name: JobPulse Telegram Notifications

on:
  schedule:
    # 8:00 AM IST daily digest (02:30 UTC)
    - cron: '30 2 * * *'
    # Every 6 hours — instant alerts after Phase 1 (02:30, 08:30, 14:30, 20:30 UTC)
    - cron: '30 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - digest
          - instant

jobs:
  telegram-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE_NOTIFY: '70'
          MIN_SCORE_INSTANT_ALERT: '85'
        run: node backend/cron/notify-digest.js ${{ github.event.inputs.mode || 'digest' }}
