name: JobPulse Telegram Notifications

on:
  schedule:
    # 8:00 AM IST daily digest (02:30 UTC)
    - cron: '30 2 * * *'
    # Every 6 hours — instant alerts (08:30, 14:30, 20:30 UTC)
    - cron: '30 8,14,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - digest
          - instant

jobs:
  jobpulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine notification mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'test' }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" = "02" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=instant" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: backend/db/jobpulse.db
          key: jobpulse-db-${{ github.repository }}

      - name: Fetch jobs from ATS boards
        if: steps.mode.outputs.mode != 'test'
        env:
          DATABASE_PATH: ./backend/db/jobpulse.db
          MIN_SCORE_SHOW: '40'
          RETENTION_DAYS: '30'
        run: node backend/cron/fetch-jobs.js

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: ./backend/db/jobpulse.db
          MIN_SCORE_NOTIFY: '70'
          MIN_SCORE_INSTANT_ALERT: '85'
        run: node backend/cron/notify-digest.js ${{ steps.mode.outputs.mode }}
